plugins { id 'com.android.application' }
android {
    namespace 'com.mooncast.miracastlab'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.mooncast.miracastlab'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-diagnostic'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
// No signing identity is created, configured, or borrowed for the release variant.
