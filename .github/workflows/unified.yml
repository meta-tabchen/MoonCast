name: Unified Android verification
on:
  workflow_dispatch:
  push:
    branches: [ main, unified/android-0.5.0, unified/community ]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore pinned complete-source inputs
        run: python3 scripts/restore_release_inputs.py
      - name: Pinned native inputs
        run: |
          python3 scripts/prepare_airplay.py --verify-sources
          python3 scripts/prepare_airplay.py --verify-aar app/libs/airplaylib.aar
          python3 scripts/prepare_unified_native.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Behavior and discovery regressions
        run: |
          python3 scripts/check_localization.py
          python3 scripts/run_locale_policy_tests.py
          python3 scripts/test_community_device_preflight.py
          python3 scripts/run_phone_message_tests.py
          python3 scripts/run_app_build_info_tests.py
          python3 scripts/run_tv_role_picker_tests.py
          node --check app/src/main/assets/browser/receiver.js
          python3 scripts/run_unit_tests.py
          python3 scripts/run_unified_policy_tests.py
          python3 scripts/run_my_tv_discovery_tests.py
          python3 scripts/run_apk_transfer_tests.py
          python3 scripts/run_apk_settings_lifecycle_tests.py
          python3 scripts/run_apk_archive_signature_tests.py
          python3 scripts/run_tv_unit_tests.py
          python3 scripts/run_airplay_unit_tests.py
          python3 scripts/run_airplay_decoder_tests.py
          python3 scripts/run_tv_audio_tests.py
          python3 scripts/run_airplay_rtp_transition_tests.py
      - name: Community identity fail-closed build guards
        run: bash scripts/test_community_build_guards.sh
      - name: Build fixed-signature community ARM64 app and lint
        run: gradle --no-daemon :unified:assembleRelease :unified:lintRelease -PmooncastAbi=arm64-v8a
      - name: Inspect combined APK
        run: python3 scripts/verify_unified_apk.py unified/build/outputs/apk/release/unified-release.apk --abi arm64-v8a
      - name: Verify fixed public community identity
        run: |
          python3 scripts/verify_community_identity.py unified/build/outputs/apk/release/unified-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 unified/build/outputs/apk/release/unified-release.apk
      - name: Build and verify community ARMv7
        run: |
          mkdir -p "$RUNNER_TEMP/community-release"
          cp unified/build/outputs/apk/release/unified-release.apk "$RUNNER_TEMP/community-release/MoonCast-0.6.0-browser-preview.4-arm64-v8a.apk"
          gradle --no-daemon :unified:assembleRelease -PmooncastAbi=armeabi-v7a
          python3 scripts/verify_unified_apk.py unified/build/outputs/apk/release/unified-release.apk --abi armeabi-v7a
          python3 scripts/verify_community_identity.py unified/build/outputs/apk/release/unified-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 unified/build/outputs/apk/release/unified-release.apk
          cp unified/build/outputs/apk/release/unified-release.apk "$RUNNER_TEMP/community-release/MoonCast-0.6.0-browser-preview.4-armeabi-v7a.apk"
      - name: Application source and pinned dependency source map (no app signing key)
        run: python3 scripts/package_unified_source.py --output "$RUNNER_TEMP/community-release/MoonCast-0.6.0-browser-preview.4-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: community-release-candidates
          path: ${{ runner.temp }}/community-release
      - uses: actions/upload-artifact@v4
        with:
          name: community-build-reports
          path: |
            unified/build/outputs/apk/release/unified-release.apk
            unified/build/reports/lint-results-release.*
            unified/build/outputs/mapping/release/mapping.txt
  device:
    # Prior software-emulator CPU starvation prevents treating routine reruns as
    # release evidence. Manual dispatch may investigate it; skipped is not passed.
    # Push/PR still run every host, build, lint, native and signing check above.
    if: github.event_name == 'workflow_dispatch'
    name: Bilingual UI and community upgrade (API ${{ matrix.api }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Official emulator packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' emulator 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      - name: Restore and build signed device fixtures
        run: |
          python3 scripts/restore_release_inputs.py
          python3 scripts/prepare_unified_native.py
          mkdir -p "$RUNNER_TEMP/mooncast-device"
          gradle --no-daemon :unified:assembleRelease :unified:assembleDebug :unified:assembleDebugAndroidTest -PmooncastAbi=x86_64
          cp unified/build/outputs/apk/release/unified-release.apk "$RUNNER_TEMP/mooncast-device/candidate55.apk"
          cp unified/build/outputs/apk/debug/unified-debug.apk "$RUNNER_TEMP/mooncast-device/debug55.apk"
          cp unified/build/outputs/apk/androidTest/debug/unified-debug-androidTest.apk "$RUNNER_TEMP/mooncast-device/test.apk"
          # Synthetic lower-version fixture only; never publish this as a past release.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('unified/build.gradle');s=p.read_text()
          if s.count('versionCode 55')!=1 or s.count("versionName '0.6.0-browser-preview.4'")!=1:raise SystemExit('Unexpected version fixture baseline')
          p.write_text(s.replace('versionCode 55','versionCode 54'))
          PY
          gradle --no-daemon :unified:assembleRelease -PmooncastAbi=x86_64
          cp unified/build/outputs/apk/release/unified-release.apk "$RUNNER_TEMP/mooncast-device/baseline54.apk"
          git restore -- unified/build.gradle
      - name: Start disposable emulator without changing host permissions
        timeout-minutes: 17
        shell: bash
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/mooncast-avd"
          export ANDROID_EMULATOR_HOME="$RUNNER_TEMP/mooncast-emulator"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_EMULATOR_HOME" "$RUNNER_TEMP/mooncast-device/evidence"
          echo no | avdmanager create avd --force --name mooncast --path "$ANDROID_AVD_HOME/mooncast.avd" --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/mooncast.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$RUNNER_TEMP/mooncast-device/evidence/avds.txt"
          grep -Fx mooncast "$RUNNER_TEMP/mooncast-device/evidence/avds.txt"
          accel=off
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then accel=on; fi
          echo "Emulator acceleration: $accel (no chmod, udev or privilege changes)"
          mkdir -p "$RUNNER_TEMP/mooncast-device/evidence"
          "$ANDROID_HOME/emulator/emulator" -avd mooncast -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -accel "$accel" > "$RUNNER_TEMP/mooncast-device/evidence/emulator.txt" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 900))
          next_status=$SECONDS
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/mooncast-device/evidence/emulator.txt"
              echo 'Emulator exited before Android boot; no UI/device validation is claimed.' >&2
              exit 1
            fi
            if [ "$(timeout 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then exit 0; fi
            if [ "$SECONDS" -ge "$next_status" ]; then
              echo "Waiting for Android boot; elapsed shell seconds: $SECONDS"
              tail -5 "$RUNNER_TEMP/mooncast-device/evidence/emulator.txt"
              next_status=$((SECONDS + 60))
            fi
            sleep 5
          done
          tail -100 "$RUNNER_TEMP/mooncast-device/evidence/emulator.txt"
          echo 'Emulator did not boot within 15 minutes; no UI/device validation is claimed.' >&2
          exit 1
      - name: Actual update, locale and screenshot checks
        run: |
          python3 scripts/run_community_device_checks.py \
            --serial emulator-5554 \
            --baseline "$RUNNER_TEMP/mooncast-device/baseline54.apk" \
            --candidate "$RUNNER_TEMP/mooncast-device/candidate55.apk" \
            --debug "$RUNNER_TEMP/mooncast-device/debug55.apk" \
            --test "$RUNNER_TEMP/mooncast-device/test.apk" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output "$RUNNER_TEMP/mooncast-device/evidence/ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-api${{ matrix.api }}-device-evidence
          path: ${{ runner.temp }}/mooncast-device/evidence

      - name: Optional authentic UI demo (after saved verification evidence)
        if: success() && matrix.api == 35
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/record_community_demo.py --serial emulator-5554 \
            --verification-manifest "$RUNNER_TEMP/mooncast-device/evidence/ui/manifest.json" \
            --output "$RUNNER_TEMP/mooncast-demo" --language zh
      - uses: actions/upload-artifact@v4
        if: always() && matrix.api == 35
        with:
          name: community-api35-ui-demo
          path: ${{ runner.temp }}/mooncast-demo
          if-no-files-found: warn
