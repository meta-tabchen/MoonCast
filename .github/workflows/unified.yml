name: Unified Android verification
on:
  workflow_dispatch:
  push:
    branches: [ main, unified/android-0.5.0, unified/community, codex/mooncast-0.9 ]
    paths-ignore: [release/reviewed-0.9.json]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore pinned complete-source inputs
        run: python3 scripts/restore_release_inputs.py
      - name: Snapshot exact committed source before verified generated native overrides
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/package_unified_source.py --output "$RUNNER_TEMP/community-base-source.zip"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12102154262
          merge-multiple: true
          path: ${{ runner.temp }}/reused-native
          run-id: 39035789360
          github-token: ${{ github.token }}
      - name: Require every native input unchanged before reusing original cloud-built outputs
        run: python3 scripts/reuse_native_candidate.py --bundle "$RUNNER_TEMP/reused-native"
      - name: Pinned native inputs
        run: |
          python3 scripts/prepare_airplay.py --verify-sources
          python3 scripts/prepare_airplay.py --verify-aar app/libs/airplaylib.aar
          python3 scripts/prepare_unified_native.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Behavior and discovery regressions
        run: |
          python3 scripts/run_release_asset_policy_tests.py
          python3 scripts/run_publication_policy_tests.py
          python3 scripts/run_candidate_selection_tests.py
          python3 scripts/run_receiver_runner_tests.py
          python3 scripts/run_receiver_jni_thread_tests.py
          python3 scripts/run_sunshine_candidate_tests.py
          python3 scripts/check_localization.py
          python3 scripts/run_locale_policy_tests.py
          python3 scripts/test_community_device_preflight.py
          python3 scripts/run_phone_message_tests.py
          python3 scripts/run_app_build_info_tests.py
          gradle --no-daemon :unified:resolveHostIdentityTestArtifacts
          python3 scripts/run_host_identity_tests.py
          python3 scripts/run_phone_tab_startup_tests.py
          python3 scripts/run_tv_role_picker_tests.py
          node --check app/src/main/assets/browser/receiver.js
          node tests/browser_android_receiver.cjs --self-test
          python3 scripts/run_unit_tests.py
          python3 scripts/run_airplay_sender_tests.py
          python3 scripts/run_unified_policy_tests.py
          python3 scripts/run_my_tv_discovery_tests.py
          python3 scripts/run_apk_transfer_tests.py
          python3 scripts/run_apk_settings_lifecycle_tests.py
          python3 scripts/run_apk_archive_signature_tests.py
          python3 scripts/run_tv_unit_tests.py
          python3 scripts/run_airplay_unit_tests.py
          python3 scripts/run_airplay_decoder_tests.py
          python3 scripts/run_tv_audio_tests.py
          python3 scripts/run_airplay_rtp_transition_tests.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
      - name: AirPlay sender loopback wire regressions (not TV acceptance)
        run: python3 scripts/run_airplay_wire_tests.py
      - name: Community identity fail-closed build guards
        run: bash scripts/test_community_build_guards.sh
      - name: Build fixed-signature community ARM64 app and lint
        run: gradle --no-daemon :unified:assembleRelease :unified:lintRelease -PmooncastAbi=arm64-v8a -PmooncastBuildId="$GITHUB_SHA"
      - name: QR roundtrip against pinned binary and bundled sources
        run: python3 scripts/run_browser_qr_tests.py
      - name: Inspect combined APK
        run: |
          python3 scripts/verify_unified_apk.py unified/build/outputs/apk/release/unified-release.apk --abi arm64-v8a
          python3 scripts/verify_bouncycastle_apk.py unified/build/outputs/apk/release/unified-release.apk
      - name: Verify fixed public community identity
        run: |
          python3 scripts/verify_community_identity.py unified/build/outputs/apk/release/unified-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 unified/build/outputs/apk/release/unified-release.apk
      - name: Build and verify community ARMv7
        run: |
          mkdir -p "$RUNNER_TEMP/community-release"
          cp unified/build/outputs/apk/release/unified-release.apk "$RUNNER_TEMP/community-release/MoonCast-0.9-arm64-v8a.apk"
          gradle --no-daemon :unified:assembleRelease :unified:lintRelease -PmooncastAbi=armeabi-v7a -PmooncastBuildId="$GITHUB_SHA"
          python3 scripts/verify_unified_apk.py unified/build/outputs/apk/release/unified-release.apk --abi armeabi-v7a
          python3 scripts/verify_bouncycastle_apk.py unified/build/outputs/apk/release/unified-release.apk
          python3 scripts/verify_community_identity.py unified/build/outputs/apk/release/unified-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 unified/build/outputs/apk/release/unified-release.apk
          cp unified/build/outputs/apk/release/unified-release.apk "$RUNNER_TEMP/community-release/MoonCast-0.9-armeabi-v7a.apk"
      - name: Application source and pinned dependency source map (no app signing key)
        run: |
          python3 scripts/package_native_candidate.py --base "$RUNNER_TEMP/community-base-source.zip" --output "$RUNNER_TEMP/community-release/MoonCast-0.9-source.zip" --expected-commit "$GITHUB_SHA"
          python3 scripts/prepare_release_assets.py --directory "$RUNNER_TEMP/community-release" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: community-release-candidates
          path: ${{ runner.temp }}/community-release
      - uses: actions/upload-artifact@v4
        with:
          name: community-build-reports
          path: |
            unified/build/outputs/apk/release/unified-release.apk
            unified/build/reports/lint-results-release.*
            unified/build/outputs/mapping/release/mapping.txt
  publish:
    if: github.repository == 'meta-tabchen/MoonCast' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-mooncast-0.9]')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: mooncast-release-v0.9
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select unchanged bytes from the inspected exact-source candidate run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select_reviewed_release_candidate.py --directory "$RUNNER_TEMP/community-release" --commit "$GITHUB_SHA" | tee "$RUNNER_TEMP/reviewed-candidate-selection.json"
      - name: Publish exact verified draft and verify unauthenticated public bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_community_release.py --directory "$RUNNER_TEMP/community-release" --commit "$GITHUB_SHA" --selection-proof "$RUNNER_TEMP/reviewed-candidate-selection.json" | tee "$RUNNER_TEMP/public-release-verification.json"
      - name: Correct obsolete historical source-upload banner after public source verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/correct_release08_source_notice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-verification
          path: |
            ${{ runner.temp }}/public-release-verification.json
            ${{ runner.temp }}/reviewed-candidate-selection.json
  device:
    # Prior software-emulator CPU starvation prevents treating routine reruns as
    # release evidence. Manual dispatch may investigate it; skipped is not passed.
    # Push/PR still run every host, build, lint, native and signing check above.
    if: github.event_name == 'workflow_dispatch'
    name: Bilingual UI and community upgrade (API ${{ matrix.api }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Official emulator packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' emulator 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12102154262
          merge-multiple: true
          path: ${{ runner.temp }}/reused-native
          run-id: 39035789360
          github-token: ${{ github.token }}
      - name: Restore and build signed device fixtures
        run: |
          python3 scripts/restore_release_inputs.py
          python3 scripts/reuse_native_candidate.py --bundle "$RUNNER_TEMP/reused-native"
          python3 scripts/prepare_unified_native.py
          mkdir -p "$RUNNER_TEMP/mooncast-device"
          gradle --no-daemon :unified:assembleRelease :unified:assembleDebug :unified:assembleDebugAndroidTest -PmooncastAbi=x86_64 -PmooncastBuildId="$GITHUB_SHA"
          cp unified/build/outputs/apk/release/unified-release.apk "$RUNNER_TEMP/mooncast-device/candidate66.apk"
          cp unified/build/outputs/apk/debug/unified-debug.apk "$RUNNER_TEMP/mooncast-device/debug66.apk"
          cp unified/build/outputs/apk/androidTest/debug/unified-debug-androidTest.apk "$RUNNER_TEMP/mooncast-device/test.apk"
          # Synthetic lower-version fixture only; never publish this as a past release.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('unified/build.gradle');s=p.read_text()
          if s.count('versionCode 66')!=1 or s.count("versionName '0.9'")!=1:raise SystemExit('Unexpected version fixture baseline')
          p.write_text(s.replace('versionCode 66','versionCode 65'))
          PY
          gradle --no-daemon :unified:assembleRelease -PmooncastAbi=x86_64 -PmooncastBuildId="$GITHUB_SHA"
          cp unified/build/outputs/apk/release/unified-release.apk "$RUNNER_TEMP/mooncast-device/baseline65.apk"
          git restore -- unified/build.gradle
      - name: Start disposable emulator without changing host permissions
        timeout-minutes: 17
        shell: bash
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/mooncast-avd"
          export ANDROID_EMULATOR_HOME="$RUNNER_TEMP/mooncast-emulator"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_EMULATOR_HOME" "$RUNNER_TEMP/mooncast-device/evidence"
          echo no | avdmanager create avd --force --name mooncast --path "$ANDROID_AVD_HOME/mooncast.avd" --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/mooncast.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$RUNNER_TEMP/mooncast-device/evidence/avds.txt"
          grep -Fx mooncast "$RUNNER_TEMP/mooncast-device/evidence/avds.txt"
          accel=off
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then accel=on; fi
          echo "Emulator acceleration: $accel (no chmod, udev or privilege changes)"
          mkdir -p "$RUNNER_TEMP/mooncast-device/evidence"
          "$ANDROID_HOME/emulator/emulator" -avd mooncast -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -accel "$accel" > "$RUNNER_TEMP/mooncast-device/evidence/emulator.txt" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 900))
          next_status=$SECONDS
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/mooncast-device/evidence/emulator.txt"
              echo 'Emulator exited before Android boot; no UI/device validation is claimed.' >&2
              exit 1
            fi
            if [ "$(timeout 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then exit 0; fi
            if [ "$SECONDS" -ge "$next_status" ]; then
              echo "Waiting for Android boot; elapsed shell seconds: $SECONDS"
              tail -5 "$RUNNER_TEMP/mooncast-device/evidence/emulator.txt"
              next_status=$((SECONDS + 60))
            fi
            sleep 5
          done
          tail -100 "$RUNNER_TEMP/mooncast-device/evidence/emulator.txt"
          echo 'Emulator did not boot within 15 minutes; no UI/device validation is claimed.' >&2
          exit 1
      - name: Actual update, locale and screenshot checks
        run: |
          python3 scripts/run_community_device_checks.py \
            --serial emulator-5554 \
            --baseline "$RUNNER_TEMP/mooncast-device/baseline65.apk" \
            --candidate "$RUNNER_TEMP/mooncast-device/candidate66.apk" \
            --debug "$RUNNER_TEMP/mooncast-device/debug66.apk" \
            --test "$RUNNER_TEMP/mooncast-device/test.apk" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output "$RUNNER_TEMP/mooncast-device/evidence/ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-api${{ matrix.api }}-device-evidence
          path: ${{ runner.temp }}/mooncast-device/evidence

      - name: Optional authentic UI demo (after saved verification evidence)
        if: success() && matrix.api == 35
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/record_community_demo.py --serial emulator-5554 \
            --verification-manifest "$RUNNER_TEMP/mooncast-device/evidence/ui/manifest.json" \
            --output "$RUNNER_TEMP/mooncast-demo" --language zh
      - uses: actions/upload-artifact@v4
        if: always() && matrix.api == 35
        with:
          name: community-api35-ui-demo
          path: ${{ runner.temp }}/mooncast-demo
          if-no-files-found: warn
