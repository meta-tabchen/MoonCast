name: Session bridge build
on:
  push:
    branches: [codex/session-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;27.0.12077973'
      - run: python3 scripts/build_session_bridge.py --ndk "$ANDROID_HOME/ndk/27.0.12077973" --output work/session-bridge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mooncast-session-bridge
          path: work/session-bridge
          retention-days: 14
