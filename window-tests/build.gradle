plugins { id 'com.android.application' }
android {
 namespace 'com.mooncast.host'
 compileSdk 35
 defaultConfig { applicationId 'com.mooncast.windowtest'; minSdk 26; targetSdk 35; versionCode 1; versionName '1'; testInstrumentationRunner 'com.mooncast.unified.WindowInstrumentation' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets {
  main.java.srcDirs = ['../app/src/main/java','../unified/src/debug/java']
  main.java.includes = ['com/mooncast/host/ScreenDimmer.java','com/mooncast/host/ScreenDimState.java','com/mooncast/host/DimFixtureService.java','com/mooncast/unified/DimFixtureActivity.java']
  androidTest.java.srcDirs += ['../unified/src/androidTest/java']
  androidTest.java.includes = ['com/mooncast/unified/ScreenDimDeviceTest.java','com/mooncast/unified/WindowInstrumentation.java']
 }
}
