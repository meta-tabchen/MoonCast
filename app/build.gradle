plugins { id 'com.android.application' }
def fromSource = providers.gradleProperty('nativeFromSource').isPresent()
// Optional standalone device APK; absent keeps the universal three-ABI build.
def phoneAbi = providers.gradleProperty('mooncastPhoneAbi').orNull
def supportedPhoneAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
if (phoneAbi != null && !supportedPhoneAbis.contains(phoneAbi)) {
    throw new GradleException('mooncastPhoneAbi must be arm64-v8a, armeabi-v7a, or x86_64.')
}
def selectedPhoneAbis = phoneAbi == null ? supportedPhoneAbis : [phoneAbi]
apply from: rootProject.file('gradle/phone-signing.gradle')
def phoneSigning = resolvePhoneReleaseSigning({ key -> providers.gradleProperty(key).orNull }, { key -> System.getenv(key) }, { value -> rootProject.file(value) })
android {
    namespace 'com.mooncast.host'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.mooncast.host'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.4.6-apk-selection-fix'
        testInstrumentationRunner 'com.mooncast.host.RenderingInstrumentation'
        ndk { abiFilters.addAll(selectedPhoneAbis) }
        if (fromSource) {
            externalNativeBuild { cmake { cppFlags '-std=c++20' } }
        }
    }
    if (phoneSigning != null) {
        signingConfigs {
            phoneRelease {
                storeFile phoneSigning.storeFile
                storePassword phoneSigning.storePassword
                keyAlias phoneSigning.keyAlias
                keyPassword phoneSigning.keyPassword
            }
        }
    }
    buildFeatures { buildConfig true; aidl true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Internal tests and the explicitly authorized coexisting preview may reuse
    // the existing test identity. Never generate a replacement key.
    tasks.matching { it.name in ["validateSigningDebug", "validateSigningDebugAndroidTest", "validateSigningPreview"] }.configureEach {
        doFirst {
            if (!android.signingConfigs.debug.storeFile.isFile())
                throw new GradleException("Existing preview/test signing identity is absent; key generation is forbidden.")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Deliberately unsigned until the owner provisions the stable release identity.
            signingConfig phoneSigning == null ? null : signingConfigs.phoneRelease
        }
        preview {
            initWith release
            debuggable false
            jniDebuggable false
            versionNameSuffix "-coexist"
            // Explicit opt-in variant only. This never changes production release signing.
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
        }
    }
    if (fromSource) {
        ndkVersion '27.0.12077973'
        sourceSets.main.jniLibs.srcDirs = []
        externalNativeBuild { cmake { path '../native/sunshine/CMakeLists.txt'; version '3.31.1' } }
    }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libmooncast_sessions.so', '**/libgojni.so'] } }
    lint { abortOnError true }
}
androidComponents {
    onVariants(selector().withBuildType("preview")) { variant ->
        variant.applicationId.set("com.mooncast.preview.phone")
    }
}
dependencies {
    implementation files('libs/airplaylib.aar')
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
apply from: rootProject.file('gradle/browser-webrtc.gradle')
if (!fromSource) {
    tasks.named('preBuild').configure {
        doFirst {
            for (abi in selectedPhoneAbis) {
                if (!file("src/main/jniLibs/${abi}/libsunshine.so").isFile()) {
                    throw new GradleException('Missing native host core. Run python scripts/prepare_native.py first.')
                }
            }
        }
    }
}

dependencies { implementation project(':locale-core') }
