plugins { id 'com.android.application' }
apply from: rootProject.file('gradle/tv-signing.gradle')
def externalTvSigning = resolveTvReleaseSigning(
        { findProperty(it) }, { System.getenv(it) }, { rootProject.file(it) })
def coexistSigning = providers.gradleProperty('mooncastTvCoexistPreview').orNull == 'true'
def existingTestKey = new File(System.getenv('ANDROID_USER_HOME') ?: new File(System.getProperty('user.home'), '.android').path, 'debug.keystore')
if (coexistSigning && !existingTestKey.isFile()) {
    throw new GradleException('Coexist preview requires an already existing local debug test identity; no key will be generated.')
}
def tvAbi = providers.gradleProperty('mooncastTvAbi').orNull
if (tvAbi != null && !(tvAbi in ['arm64-v8a', 'armeabi-v7a', 'x86_64'])) throw new GradleException('Unsupported TV preview ABI')
android {
    namespace 'com.mooncast.tv'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.mooncast.tv'
        testInstrumentationRunner 'com.mooncast.tv.TvUiInstrumentation'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.4.5-audiofix'
        ndk { if (tvAbi != null) abiFilters tvAbi else abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (coexistSigning) {
            existingPreviewTest {
                storeFile existingTestKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (externalTvSigning != null) {
            externalRelease {
                storeFile externalTvSigning.storeFile
                storePassword externalTvSigning.storePassword
                keyAlias externalTvSigning.keyAlias
                keyPassword externalTvSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Credential-free CI can inspect an unsigned release APK. Only the
            // externally supplied identity may sign a distributable TV release.
            if (externalTvSigning != null) signingConfig signingConfigs.externalRelease
        }
    }
        // Explicitly authorized, co-installable experiment. Never the production ID.
    buildTypes {
        // One-time audio regression candidate. Separate ID cannot replace older signers.
        audiofix {
            initWith release
            applicationIdSuffix '.audiofix.preview'
            versionNameSuffix '-experimental'
            debuggable false
            matchingFallbacks = ['release']
            signingConfig null
        }
        coexist {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-coexist'
            debuggable false
            matchingFallbacks = ['release']
            signingConfig coexistSigning ? signingConfigs.existingPreviewTest : null
        }
    }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
    lint { abortOnError true }
}
tasks.register('requireTvReleaseSigning') {
    group = 'verification'
    description = 'Fail unless external TV release signing inputs are complete.'
    doLast {
        if (externalTvSigning == null) {
            throw new GradleException('TV publication requires external signing. See docs/tv-signing.md; no debug-key fallback is allowed.')
        }
    }
}
dependencies {
    implementation project(':moonlight-core')
    implementation 'androidx.core:core:1.8.0'
    // Align instrumentation with versions already resolved by Media3 in the app.
    androidTestImplementation 'androidx.annotation:annotation:1.6.0'
    androidTestImplementation 'androidx.collection:collection:1.2.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
}
